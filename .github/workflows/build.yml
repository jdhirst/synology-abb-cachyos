name: Build packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # PRs from forks and PRs opened by anyone other than the repository owner
    # never receive a runner. Keep the test equally strict if this moves to an org.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.author_association == 'OWNER' &&
       github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm base-devel git curl libarchive unzip
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Validate AUR metadata
        run: su builder -c 'makepkg --printsrcinfo > .SRCINFO && bash -n PKGBUILD synosnap-dkms.install synosnap-enroll-mok'
      - name: Build package archives
        run: su builder -c 'makepkg --nodeps --noconfirm'
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: '*.pkg.tar.*'
          if-no-files-found: error

PACKAGE_NAME="synosnap"
PACKAGE_VERSION="0.12.12"
# Invoke the module's own Makefile: it generates kernel-config.h before it
# delegates to the kernel tree. DKMS 3.4 does not run PRE_BUILD directives.
MAKE[0]="make -C ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build KERNELVERSION=${kernelver} CC=clang LLVM=1"
CLEAN="make -C ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build KERNELVERSION=${kernelver} clean"
BUILT_MODULE_NAME[0]="synosnap"
DEST_MODULE_LOCATION[0]="/kernel/drivers/block/"
AUTOINSTALL="yes"
